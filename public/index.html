<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Razer Obfuscator</title><style>body{font-family:system-ui;background:#10131a;color:#f4f7fb;max-width:1100px;margin:32px auto;padding:0 18px}textarea{width:100%;min-height:360px;background:#171c25;color:#e8eef8;border:1px solid #3b4658;border-radius:8px;padding:12px;box-sizing:border-box;font:14px monospace}button,select,input{padding:9px;border-radius:6px;border:1px solid #46546a;background:#202938;color:white;margin:5px 5px 12px 0}button{background:#5b5cf0;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.panel{border:1px solid #303b4d;border-radius:8px;padding:12px;background:#141a23}.options{display:none;padding:10px;border:1px solid #46546a;border-radius:8px;background:#1a2230}.options.open{display:block}.muted{color:#aeb8c8}.warning{color:#ffd27d;font-size:13px}@media(max-width:800px){.grid{grid-template-columns:1fr}}</style></head><body><h1>Razer Obfuscator</h1><p class="muted">Offline Lua/Luau source transformation for standard Roblox Studio projects.</p><div class="panel"><button id="toggle" type="button">Set your Protection ▾</button><div id="options" class="options"><label><input id="base64" type="checkbox"> Base64 payload</label><label><input id="encrypt" type="checkbox"> XOR-encrypt payload</label><label><input id="vm" type="checkbox"> VM dispatcher (experimental)</label><label>Encryption key <input id="key" type="number" min="1" max="255" value="173"></label><p class="warning">Encoded, encrypted, and VM modes require loadstring/load at runtime. For maximum Roblox Studio compatibility, leave them off and use static transformations.</p></div></div><p><label>Level <select id="level"><option value="1">1 — rename/constants</option><option value="2">2 — strings + encoding</option><option value="3">3 — strings + encoding + selected modes</option></select></label><label>Seed <input id="seed" type="number" value="12345"></label></p><div class="grid"><section><h2>Input</h2><textarea id="source" placeholder="local message = 'Hello, Roblox!'\nprint(message)"></textarea><br><button id="run">Obfuscate</button></section><section><h2>Output</h2><textarea id="output" readonly></textarea><button id="download">Download .lua</button><p id="status" class="muted"></p></section></div><script>const $=id=>document.getElementById(id);$('toggle').onclick=()=>{$('options').classList.toggle('open')};$('run').onclick=async()=>{$('status').textContent='Working…';try{const r=await fetch('/api/obfuscate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:$('source').value,level:+$('level').value,seed:+$('seed').value,base64:$('base64').checked,encrypt:$('encrypt').checked,vm:$('vm').checked,key:+$('key').value})});const x=await r.json();if(!r.ok)throw Error(x.error);$('output').value=x.code;$('status').textContent=`${x.stats.tokens} tokens; ${x.stats.renamed} names renamed.`}catch(e){$('status').textContent=e.message}};$('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('output').value],{type:'text/plain'}));a.download='obfuscated.lua';a.click()};</script></body></html>
