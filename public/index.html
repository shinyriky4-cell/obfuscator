<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Razer Obfuscator</title><style>
body{font-family:system-ui;background:#10131a;color:#f4f7fb;max-width:1100px;margin:32px auto;padding:0 18px}textarea{width:100%;min-height:360px;background:#171c25;color:#e8eef8;border:1px solid #3b4658;border-radius:8px;padding:12px;box-sizing:border-box;font:14px monospace}button,select,input{padding:9px;border-radius:6px;border:1px solid #46546a;background:#202938;color:white;margin:5px 5px 12px 0}button{background:#5b5cf0;cursor:pointer}.grid{display:grid;grid-template-columns:1fr 1fr;gap:20px}.muted{color:#aeb8c8}@media(max-width:800px){.grid{grid-template-columns:1fr}}
</style></head><body><h1>Razer Obfuscator</h1><p class="muted">Lua/Luau source transformation for Roblox Studio projects. Do not put secrets in client code.</p>
<label>Protection level <select id="level"><option value="1">1 — rename/constants</option><option value="2">2 — packed loader</option><option value="3">3 — safe maximum</option></select></label><label>Seed <input id="seed" type="number" value="12345"></label><label><input id="pack" type="checkbox"> pack output</label><div class="grid"><section><h2>Input</h2><textarea id="source" placeholder="local message = 'Hello, Roblox!'\nprint(message)"></textarea><br><button id="run">Obfuscate</button></section><section><h2>Output</h2><textarea id="output" readonly></textarea><button id="download">Download .lua</button><p id="status" class="muted"></p></section></div>
<script>
const $=id=>document.getElementById(id);$('run').onclick=async()=>{ $('status').textContent='Working…'; try{const r=await fetch('/api/obfuscate',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify({source:$('source').value,level:+$('level').value,seed:+$('seed').value,pack:$('pack').checked})});const x=await r.json();if(!r.ok)throw Error(x.error);$('output').value=x.code;$('status').textContent=`${x.stats.tokens} tokens; ${x.stats.renamed} names renamed.`}catch(e){$('status').textContent=e.message}}; $('download').onclick=()=>{const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([$('output').value],{type:'text/plain'}));a.download='obfuscated.lua';a.click()};
</script></body></html>
